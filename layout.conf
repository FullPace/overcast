[tab MANUAL]
art file=skin/overcast_bg.jpg
enum_v cx=150 cy=430 label="" key=manual_page sw=220 options="BASICS,MIDI,MODULATION,GRANULAR,STRETCH,LOOPING DELAY,SPECTRAL,OLIVERB,RESONESTOR"
text cx=320 cy=214 label="BASICS" size=1.8 weight=700 color=c83d58 align=left when=manual_page:0
text cx=320 cy=254 label="Overcast records the track's audio into a buffer and plays it back as clouds of grains, stretched," size=1.45 weight=600 color=1a1919 align=left when=manual_page:0
text cx=320 cy=289 label="looped, frozen as a spectrum, as a reverb or through resonators: Mutable Instruments Clouds with the" size=1.45 weight=600 color=1a1919 align=left when=manual_page:0
text cx=320 cy=324 label="Parasites firmware. Pick the mode at the top of the OVERCAST tab; the knob names follow the mode." size=1.45 weight=600 color=1a1919 align=left when=manual_page:0
text cx=320 cy=394 label="FREEZE (snowflake): stops recording. The cloud keeps playing what is in the buffer; with BLEND below" size=1.45 weight=600 color=1a1919 align=left when=manual_page:0
text cx=320 cy=429 label="100 % you still hear the dry input next to it." size=1.45 weight=600 color=1a1919 align=left when=manual_page:0
text cx=320 cy=464 label="QUALITY: lower quality = longer buffer, grittier sound. 16-bit stereo about 0.75 s, 16-bit mono 1.35 s," size=1.45 weight=600 color=1a1919 align=left when=manual_page:0
text cx=320 cy=499 label="8-bit stereo 3 s, 8-bit mono 5.4 s. Changing quality or mode clears the buffer." size=1.45 weight=600 color=1a1919 align=left when=manual_page:0
text cx=320 cy=534 label="REVERSE: grains (Granular) and the delay (Looping Delay) play backwards." size=1.45 weight=600 color=1a1919 align=left when=manual_page:0
text cx=320 cy=569 label="IN GAIN / OUT GAIN: level into the module and after it; the output has a limiter." size=1.45 weight=600 color=1a1919 align=left when=manual_page:0
text cx=320 cy=604 label="Q-Links follow the tab on screen: four rows of four, as on the OVERCAST tab." size=1.45 weight=600 color=1a1919 align=left when=manual_page:0
text cx=320 cy=214 label="MIDI" size=1.8 weight=700 color=c83d58 align=left when=manual_page:1
text cx=320 cy=254 label="MPC OS sends no MIDI to insert effects, so every Overcast opens its own MIDI input:" size=1.45 weight=600 color=1a1919 align=left when=manual_page:1
text cx=320 cy=289 label="Overcast 1, Overcast 2, ... (the number counts the instances in the order they were inserted)." size=1.45 weight=600 color=1a1919 align=left when=manual_page:1
text cx=320 cy=359 label="To play it: make a MIDI track, set its MIDI output to Overcast 1 (any channel) and record notes." size=1.45 weight=600 color=1a1919 align=left when=manual_page:1
text cx=320 cy=394 label="Every note is a trigger, like the module's TRIG input: a grain in Granular, a strike in Resonestor," size=1.45 weight=600 color=1a1919 align=left when=manual_page:1
text cx=320 cy=429 label="a tap in Looping Delay. Envelopes with their trigger set to MIDI follow the notes too." size=1.45 weight=600 color=1a1919 align=left when=manual_page:1
text cx=320 cy=499 label="MIDI PITCH on: notes also transpose, relative to C3, like the module's V/OCT input." size=1.45 weight=600 color=1a1919 align=left when=manual_page:1
text cx=320 cy=534 label="MIDI PITCH off: notes only trigger, and the PITCH knob alone sets the pitch." size=1.45 weight=600 color=1a1919 align=left when=manual_page:1
text cx=320 cy=604 label="Classic setting: Granular, FREEZE on, DENSITY at 12 o'clock: every note plays a grain at its pitch." size=1.45 weight=600 color=1a1919 align=left when=manual_page:1
text cx=320 cy=214 label="MODULATION" size=1.8 weight=700 color=c83d58 align=left when=manual_page:2
text cx=320 cy=254 label="Two envelopes, two LFOs and an 8-slot matrix, like patch cables into the module's CV inputs." size=1.45 weight=600 color=1a1919 align=left when=manual_page:2
text cx=320 cy=324 label="ENV 1 / ENV 2: attack, decay, sustain, release. TRIGGER: MIDI notes, or LFO 1 / LFO 2 (each cycle)." size=1.45 weight=600 color=1a1919 align=left when=manual_page:2
text cx=320 cy=359 label="LFO 1 / LFO 2: seven shapes. SYNC off: the knob sets the rate in Hz. SYNC on: it locks to the MPC" size=1.45 weight=600 color=1a1919 align=left when=manual_page:2
text cx=320 cy=394 label="tempo and picks a note value from 4 bars to 1/32." size=1.45 weight=600 color=1a1919 align=left when=manual_page:2
text cx=320 cy=464 label="MATRIX: source -> destination -> amount (-100 to +100 %). Sources: LFOs, envelopes, note velocity." size=1.45 weight=600 color=1a1919 align=left when=manual_page:2
text cx=320 cy=499 label="Several slots on one destination add up. FREEZE and TRIGGER are gates: on above 50 %." size=1.45 weight=600 color=1a1919 align=left when=manual_page:2
text cx=320 cy=534 label="An LFO square wave on TRIGGER clocks grains, or strikes the Resonestor, in time with the MPC." size=1.45 weight=600 color=1a1919 align=left when=manual_page:2
text cx=320 cy=604 label="Q-Links on this tab: ENV 1, ENV 2, the LFO rates and shapes, the amounts of slots 1 to 4." size=1.45 weight=600 color=1a1919 align=left when=manual_page:2
text cx=320 cy=214 label="GRANULAR" size=1.8 weight=700 color=c83d58 align=left when=manual_page:3
text cx=320 cy=254 label="The classic Clouds sound: short grains taken from the buffer, layered into a cloud." size=1.45 weight=600 color=1a1919 align=left when=manual_page:3
text cx=320 cy=324 label="POSITION: where in the buffer the grains start (right = further back in time)." size=1.45 weight=600 color=1a1919 align=left when=manual_page:3
text cx=320 cy=359 label="SIZE: grain length, from tiny clicks to long smears." size=1.45 weight=600 color=1a1919 align=left when=manual_page:3
text cx=320 cy=394 label="PITCH: transposition of the grains, in semitones." size=1.45 weight=600 color=1a1919 align=left when=manual_page:3
text cx=320 cy=429 label="DENSITY: 12 o'clock = no grains. Counter-clockwise: grains at a steady rate," size=1.45 weight=600 color=1a1919 align=left when=manual_page:3
text cx=320 cy=464 label="clockwise: at random times; further out = more grains." size=1.45 weight=600 color=1a1919 align=left when=manual_page:3
text cx=320 cy=499 label="TEXTURE: grain envelope from hard square to soft bell; past 3 o'clock it adds diffusion." size=1.45 weight=600 color=1a1919 align=left when=manual_page:3
text cx=320 cy=534 label="BLEND, SPREAD, FEEDBACK, REVERB: dry/wet mix, stereo spread, feedback into the buffer, reverb." size=1.45 weight=600 color=1a1919 align=left when=manual_page:3
text cx=320 cy=569 label="TRIGGER / MIDI note: plays one grain. FREEZE holds the buffer." size=1.45 weight=600 color=1a1919 align=left when=manual_page:3
text cx=320 cy=214 label="STRETCH" size=1.8 weight=700 color=c83d58 align=left when=manual_page:4
text cx=320 cy=254 label="Time stretching and pitch shifting (WSOLA): the buffer plays smoothly, without the grain texture." size=1.45 weight=600 color=1a1919 align=left when=manual_page:4
text cx=320 cy=324 label="SCRUB: the playback position in the buffer; move it to scrub through the recording." size=1.45 weight=600 color=1a1919 align=left when=manual_page:4
text cx=320 cy=359 label="WINDOW: the size of the pieces that are spliced together (small = buzzy, large = smooth)." size=1.45 weight=600 color=1a1919 align=left when=manual_page:4
text cx=320 cy=394 label="PITCH: transposition, independent of speed." size=1.45 weight=600 color=1a1919 align=left when=manual_page:4
text cx=320 cy=429 label="DIFFUSION: smears the sound into a wash." size=1.45 weight=600 color=1a1919 align=left when=manual_page:4
text cx=320 cy=464 label="FILTER: low-pass counter-clockwise, high-pass clockwise." size=1.45 weight=600 color=1a1919 align=left when=manual_page:4
text cx=320 cy=499 label="LOOP SYNC (trigger / MIDI note): restarts playback in sync." size=1.45 weight=600 color=1a1919 align=left when=manual_page:4
text cx=320 cy=534 label="With FREEZE on, SCRUB moves through the frozen audio: a slow-motion player." size=1.45 weight=600 color=1a1919 align=left when=manual_page:4
text cx=320 cy=214 label="LOOPING DELAY" size=1.8 weight=700 color=c83d58 align=left when=manual_page:5
text cx=320 cy=254 label="A delay with a pitch shifter; with FREEZE on it becomes a looper." size=1.45 weight=600 color=1a1919 align=left when=manual_page:5
text cx=320 cy=324 label="DELAY: the delay time." size=1.45 weight=600 color=1a1919 align=left when=manual_page:5
text cx=320 cy=359 label="LOOP SIZE: the pitch shifter's window, and the loop length while frozen." size=1.45 weight=600 color=1a1919 align=left when=manual_page:5
text cx=320 cy=394 label="PITCH: transposes the echoes (near 0 the pitch shifter is bypassed)." size=1.45 weight=600 color=1a1919 align=left when=manual_page:5
text cx=320 cy=429 label="DIFFUSION: smears the echoes." size=1.45 weight=600 color=1a1919 align=left when=manual_page:5
text cx=320 cy=464 label="FILTER: low-pass counter-clockwise, high-pass clockwise." size=1.45 weight=600 color=1a1919 align=left when=manual_page:5
text cx=320 cy=499 label="FEEDBACK: more repeats." size=1.45 weight=600 color=1a1919 align=left when=manual_page:5
text cx=320 cy=534 label="TAP (trigger / MIDI notes): taps the delay time, so echoes follow your notes' rhythm." size=1.45 weight=600 color=1a1919 align=left when=manual_page:5
text cx=320 cy=569 label="REVERSE plays the delay backwards." size=1.45 weight=600 color=1a1919 align=left when=manual_page:5
text cx=320 cy=214 label="SPECTRAL" size=1.8 weight=700 color=c83d58 align=left when=manual_page:6
text cx=320 cy=254 label="A phase vocoder: the sound is turned into its spectrum and resynthesised." size=1.45 weight=600 color=1a1919 align=left when=manual_page:6
text cx=320 cy=324 label="BUFFER: which part of the buffer is analysed." size=1.45 weight=600 color=1a1919 align=left when=manual_page:6
text cx=320 cy=359 label="WARP: shifts and bends the spectrum (formant-like changes); 12 o'clock = unchanged." size=1.45 weight=600 color=1a1919 align=left when=manual_page:6
text cx=320 cy=394 label="PITCH: transposition." size=1.45 weight=600 color=1a1919 align=left when=manual_page:6
text cx=320 cy=429 label="REFRESH: how often the spectrum is updated; low = slow, held chords; far out adds phase randomness." size=1.45 weight=600 color=1a1919 align=left when=manual_page:6
text cx=320 cy=464 label="QUANTIZE: reduces the spectrum to fewer, louder partials: from smooth to robotic." size=1.45 weight=600 color=1a1919 align=left when=manual_page:6
text cx=320 cy=499 label="GLITCH (trigger / MIDI note): a spectral glitch." size=1.45 weight=600 color=1a1919 align=left when=manual_page:6
text cx=320 cy=534 label="FREEZE holds the current spectrum: an endless drone." size=1.45 weight=600 color=1a1919 align=left when=manual_page:6
text cx=320 cy=214 label="OLIVERB" size=1.8 weight=700 color=c83d58 align=left when=manual_page:7
text cx=320 cy=254 label="Parasites' big modulated reverb, from Clouds' reverb." size=1.45 weight=600 color=1a1919 align=left when=manual_page:7
text cx=320 cy=324 label="PREDELAY: time before the reverb starts (synced to taps on CLOCK)." size=1.45 weight=600 color=1a1919 align=left when=manual_page:7
text cx=320 cy=359 label="ROOM SIZE: the size of the space." size=1.45 weight=600 color=1a1919 align=left when=manual_page:7
text cx=320 cy=394 label="DAMPING: low-pass counter-clockwise, high-pass clockwise." size=1.45 weight=600 color=1a1919 align=left when=manual_page:7
text cx=320 cy=429 label="DECAY: reverb time." size=1.45 weight=600 color=1a1919 align=left when=manual_page:7
text cx=320 cy=464 label="SHIMMER: pitches the reverb tail up or down (e.g. +12 for the classic shimmer)." size=1.45 weight=600 color=1a1919 align=left when=manual_page:7
text cx=320 cy=499 label="DIFFUSION: how dense the reflections are. DRY/WET: the mix." size=1.45 weight=600 color=1a1919 align=left when=manual_page:7
text cx=320 cy=534 label="MOD SPEED / MOD AMOUNT: modulation of the reverb's delay lines (chorus, wobble)." size=1.45 weight=600 color=1a1919 align=left when=manual_page:7
text cx=320 cy=569 label="INFINITE (freeze): the tail never decays. CLOCK (trigger / MIDI notes): tap tempo for PREDELAY." size=1.45 weight=600 color=1a1919 align=left when=manual_page:7
text cx=320 cy=214 label="RESONESTOR" size=1.8 weight=700 color=c83d58 align=left when=manual_page:8
text cx=320 cy=254 label="Parasites' resonator: two voices of tuned combs, excited by bursts or by the input." size=1.45 weight=600 color=1a1919 align=left when=manual_page:8
text cx=320 cy=289 label="Play it with MIDI notes (or an LFO / envelope on TRIGGER); each strike switches voice." size=1.45 weight=600 color=1a1919 align=left when=manual_page:8
text cx=320 cy=359 label="BURST: the excitation, from a short damped click to a longer noisy burst." size=1.45 weight=600 color=1a1919 align=left when=manual_page:8
text cx=320 cy=394 label="CHORD: the interval/chord the combs are tuned to." size=1.45 weight=600 color=1a1919 align=left when=manual_page:8
text cx=320 cy=429 label="PITCH: the root pitch (MIDI PITCH on: follows the notes)." size=1.45 weight=600 color=1a1919 align=left when=manual_page:8
text cx=320 cy=464 label="DECAY: how long the voices ring. DAMPING: dark to bright and narrow." size=1.45 weight=600 color=1a1919 align=left when=manual_page:8
text cx=320 cy=499 label="VOICES L/R: the two voices apart in stereo / separated. DISTORTION: drive." size=1.45 weight=600 color=1a1919 align=left when=manual_page:8
text cx=320 cy=534 label="HARMONICS: harmonic or inharmonic tuning. SCATTER: spreads the comb tunings." size=1.45 weight=600 color=1a1919 align=left when=manual_page:8
text cx=320 cy=569 label="VOICE LOCK (freeze): keeps playing the current voice. STRIKE: the trigger." size=1.45 weight=600 color=1a1919 align=left when=manual_page:8
qlinks "MANUAL" = manual_page
